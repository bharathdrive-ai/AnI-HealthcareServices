<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AniBuddy | AnI-HealthcareServices</title>
<meta name="description" content="Chat with AniBuddy, the AnI-HealthcareServices help assistant: doctors, OPD days, free appointment slots, fees, visiting hours and admissions.">
<meta property="og:title" content="AniBuddy — AnI-HealthcareServices">
<meta property="og:description" content="Ask about doctors, OPD days, free appointment slots, fees and more.">
<meta property="og:image" content="../assets/anibuddy-128.png">
<meta name="theme-color" content="#1f6f61">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<script>/* Apply a saved theme before the page paints */try{var t=localStorage.getItem("jac.theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/mediassist.css">
<style>
/* Same colour tokens as the website (index.html): light = surgical green, dark = logo blue. */
:root{
  --bg:#f6f8f7;--surface:#ffffff;--ink:#10221e;--muted:#4f6560;--line:#d6e0dd;
  --scrub:#1f6f61;--scrub-soft:#e2efeb;--on-accent:#ffffff;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081426;--surface:#0f2140;--ink:#eaf1fb;--muted:#a9bbd6;--line:#22395e;
  --scrub:#5ba8ff;--scrub-soft:#12305a;--on-accent:#06121f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081426;--surface:#0f2140;--ink:#eaf1fb;--muted:#a9bbd6;--line:#22395e;
  --scrub:#5ba8ff;--scrub-soft:#12305a;--on-accent:#06121f;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;height:100dvh}
a{color:var(--scrub)}
.top{flex:none;display:flex;align-items:center;gap:.75rem;padding:.6rem 16px;padding-top:calc(.6rem + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);min-width:0;margin-right:auto}
.logo{height:40px;width:auto;flex:none;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{font-size:.75rem;color:var(--muted)}
.links{display:flex;align-items:center;gap:.4rem}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:0 .8rem;border-radius:999px;font-size:.88rem;font-weight:600;text-decoration:none;white-space:nowrap}
.links a.ghost{color:var(--ink);border:1px solid var(--line)}
.links a.ghost:hover{border-color:var(--scrub);color:var(--scrub)}
.links a.solid{background:var(--scrub);color:var(--on-accent)}
.theme-btn{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.theme-btn:hover{border-color:var(--scrub);color:var(--scrub)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}:root[data-theme="dark"] .theme-btn .moon{display:block}
main{flex:1;min-height:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#maMount{height:100%}
@media (max-width:700px){.brand-text small{display:none}}
@media (max-width:560px){
  .brand-text{display:none}
  .links a.ghost{display:none}
  main{padding:0}
}
</style>
</head>
<body data-ma-page>
<header class="top">
  <a class="brand" href="../index.html" aria-label="AnI-HealthcareServices website">
    <picture><source srcset="../assets/ani-logo-96.webp 1x, ../assets/ani-logo-160.webp 2x" type="image/webp"><img class="logo" src="../assets/ani-logo-96.png" width="102" height="40" alt="AnI-HealthcareServices"></picture>
    <span class="brand-text"><b>AnI-HealthcareServices</b><small>AniBuddy help desk</small></span>
  </a>
  <nav class="links" aria-label="Site">
    <a class="ghost" href="../index.html">Website</a>
    <a class="solid" href="../patient/index.html">Book appointment</a>
  </nav>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
</header>
<main id="maMount"></main>
<noscript><p style="padding:16px">AniBuddy needs JavaScript. You can call the OPD desk on +91 80 4000 1100.</p></noscript>
<script>
// Theme switch: same behaviour and saved choice as the website
(function(){
  const root=document.documentElement,btn=document.getElementById("themeBtn"),sysDark=matchMedia("(prefers-color-scheme: dark)");
  const current=()=>root.getAttribute("data-theme")||(sysDark.matches?"dark":"light");
  function sync(){const t=current();root.setAttribute("data-theme",t);btn.setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");
    document.querySelector('meta[name="theme-color"]').setAttribute("content",t==="dark"?"#081426":"#1f6f61");}
  btn.addEventListener("click",()=>{const next=current()==="dark"?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("jac.theme",next);}catch(e){}sync();});
  sysDark.addEventListener("change",()=>{let saved=null;try{saved=localStorage.getItem("jac.theme");}catch(e){}if(!saved){root.removeAttribute("data-theme");sync();}});
  sync();
})();
</script>
<script src="../assets/mediassist.js" defer></script>
</body>
</html>
