<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appointment Booking · AnI-HealthcareServices Portal</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="theme-color" content="#1f6f61">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/data.js"></script>
<script src="assets/portal.js"></script>
<script src="assets/appt.js"></script>
</head>
<body>
<div id="content">
  <div id="kpis"></div>
  <div class="grid-2 split-5-7">
    <div class="panel">
      <div class="panel-head"><h2>Book an appointment</h2></div>
      <div class="panel-body" style="display:grid;gap:.9rem">
        <div class="form-grid">
          <div class="field"><label for="bDept">Department</label><select id="bDept"></select></div>
          <div class="field"><label for="bDoc">Doctor</label><select id="bDoc"></select></div>
          <div class="field"><label for="bDate">Date</label><input id="bDate" type="date"></div>
          <div class="field"><label for="bType">Visit type</label><select id="bType"><option>New</option><option>Follow-up</option></select></div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.45rem"><label>Available slots</label><span class="muted" style="font-size:.75rem" id="availNote"></span></div>
          <div class="slots" id="slots"></div>
        </div>
        <div class="form-grid">
          <div class="field full"><label for="bPatient">Patient</label>
            <div style="display:flex;gap:.5rem"><select id="bPatient"></select><button class="btn" type="button" id="newPat">New</button></div></div>
          <div class="field full"><label for="bReason">Reason for visit</label><input id="bReason" placeholder="e.g. chest pain review"></div>
        </div>
        <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap"><button class="btn primary" id="bookBtn">Book appointment</button><span class="err" id="bookErr"></span></div>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
const {db,esc,pill,crud,kpis,toast,opts,lookup,today,addDays,fmtDate,modal,formHTML,readForm,uid}=Portal;
const T=today();
const A=window.Appt; // shared rules: slot configuration, doctor availability, fees, tokens, payments
const $=id=>document.getElementById(id);
let chosen=null;

function refreshKpis(){
  const a=db.get("appointments"),t=a.filter(x=>x.date===T);
  kpis("#kpis",[
    {l:"Today",n:t.length,d:`${t.filter(x=>x.status==="Completed").length} completed`},
    {l:"Waiting",n:t.filter(x=>["Booked","Checked In"].includes(x.status)).length,d:"Booked or checked in"},
    {l:"In consultation",n:t.filter(x=>x.status==="In Consultation").length},
    {l:"Upcoming 7 days",n:a.filter(x=>x.date>T&&x.date<=addDays(T,7)&&x.status==="Booked").length},
    {l:"No-show rate (30 d)",n:(()=>{const p=a.filter(x=>x.date<T&&x.date>=addDays(T,-30));return p.length?Math.round(p.filter(x=>x.status==="No Show").length/p.length*100)+"%":"—";})()},
  ]);
}

function drawSlots(){
  chosen=null;
  const r=A.slots($("bDoc").value,$("bDate").value);
  A.slotGrid($("slots"),r,t=>{chosen=t;});
  $("availNote").textContent=r.ok?`${r.free} of ${r.slots.length} free · fee ${Portal.inr(A.feeFor($("bDoc").value,$("bType").value))}`:"";
}
function fillDocs(){
  const dept=$("bDept").value;
  $("bDoc").innerHTML=opts(lookup.doctors().filter(d=>db.find("staff",d.value).dept===dept));
  if(!$("bDoc").options.length) $("bDoc").innerHTML=`<option value="">No doctors in this department</option>`;
  drawSlots();
}
function fillPatients(sel){$("bPatient").innerHTML=`<option value="">Choose a patient</option>`+opts(lookup.patients(),sel);}

$("bDept").innerHTML=opts(A.deptsInOrder({opdOnly:true}).filter(d=>A.doctors(d.id).length).map(d=>({value:d.id,label:d.name})));
$("bDate").min=T;$("bDate").max=addDays(T,A.cfg().bookingWindowDays);$("bDate").value=addDays(T,new Date().getHours()>=12?1:0);
fillPatients();fillDocs();
$("bDept").onchange=fillDocs;$("bDoc").onchange=drawSlots;$("bDate").onchange=drawSlots;$("bType").onchange=drawSlots;

$("newPat").onclick=()=>{
  const F=[{k:"name",label:"Full name",required:true},{k:"phone",label:"Mobile",required:true,pattern:"^[6-9]\\d{9}$",patternMsg:"10-digit mobile number."},
    {k:"gender",label:"Gender",type:"select",required:true,options:["Male","Female","Other"]},{k:"dob",label:"Date of birth",type:"date",required:true}];
  modal({title:"Quick registration",body:formHTML(F),buttons:[{label:"Register",cls:"primary",onClick:d=>{
    const v=readForm(d,F);if(!v)return false;
    const list=db.get("patients");const max=Math.max(...list.map(p=>+p.id.replace("UHID","")));
    Object.assign(v,{id:"UHID"+(max+1),blood:"",city:"",history:"",type:"OPD",status:"Active",registered:T,insurance:"None"});
    list.unshift(v);db.set("patients",list);fillPatients(v.id);toast(`Registered ${v.name} · ${v.id}`);
  }}]});
};

$("bookBtn").onclick=()=>{
  const err=$("bookErr");
  if(!$("bPatient").value){err.textContent="Choose a patient.";return;}
  if(!chosen){err.textContent="Pick a time slot.";return;}
  const r=A.book({patient:$("bPatient").value,doctor:$("bDoc").value,date:$("bDate").value,slot:chosen,type:$("bType").value,source:"Front desk",reason:$("bReason").value.trim()});
  if(!r.ok){err.textContent=r.msg;drawSlots();return;}
  err.textContent="";
  toast(`Booked ${r.appt.id}: ${lookup.patient(r.appt.patient)} at ${r.appt.slot}, ${fmtDate(r.appt.date)} · fee ${Portal.inr(r.appt.fee)}`);
  $("bReason").value="";drawSlots();table.render();refreshKpis();
};

function takePayment(id){
  const a=A.find(id);
  modal({title:`Take payment · ${a.id}`,body:`<p>${esc(lookup.patient(a.patient))} · ${fmtDate(a.date)} ${esc(a.slot)} · <b>${Portal.inr(A.fee(a))}</b></p>
    <div class="field"><label for="pmM">Method</label><select id="pmM"><option>Cash at counter</option><option>UPI</option><option>Debit / credit card</option></select></div>
    <p class="muted" style="font-size:.78rem;margin:.6rem 0 0">Records the payment in the portal. No money is processed here.</p>`,
    buttons:[{label:"Record payment",cls:"primary",onClick:d=>{const r=A.pay(id,d.querySelector("#pmM").value);if(!r.ok){toast(r.msg);return false;}toast(`Payment recorded · ${r.payment.id}`);table.render();}}]});
}
function rowButtons(a){
  const b=[];
  if(A.payStatus(a)==="Unpaid"&&A.fee(a)>0&&!["Cancelled","No Show"].includes(a.status))b.push(["pay","Take payment"]);
  if(a.status==="Booked"){if(a.date===T)b.push(["in","Check in"]);b.push(["rs","Reschedule"],["ns","No show"],["cx","Cancel"]);}
  if(a.status==="Checked In")b.push(["start","Start"],["cx","Cancel"]);
  if(a.status==="In Consultation")b.push(["done","Complete"]);
  return b.map(([k,l])=>`<button class="btn sm link ${k==="cx"?"danger":""}" data-a="${k}" data-id="${a.id}">${l}</button>`).join("");
}
function doAction(k,id){
  const after=r=>{if(!r.ok){toast(r.msg);return;}table.render();refreshKpis();drawSlots();};
  if(k==="pay")return takePayment(id);
  if(k==="in"){const r=A.checkIn(id,{force:true});if(r.ok)toast(`Checked in · token ${r.appt.token}`);return after(r);}
  if(k==="start"){const r=A.start(id);if(r.ok)toast(`${r.appt.token} in consultation`);return after(r);}
  if(k==="done"){const r=A.complete(id,{});if(r.ok)toast(`${r.appt.id} completed`);return after(r);}
  if(k==="ns"){const r=A.noShow(id);if(r.ok)toast(`${r.appt.id} marked no-show`);return after(r);}
  if(k==="rs"){const a=A.find(id);return A.pickSlot({title:`Reschedule ${a.id} · ${lookup.patient(a.patient)}`,doc:a.doctor,date:a.date,ignore:a.id,confirmLabel:"Reschedule",
    onConfirm:(date,slot)=>{const r=A.reschedule(id,date,slot);if(r.ok){toast(`Moved to ${fmtDate(date)} ${slot}`);after(r);}return r;}});}
  if(k==="cx"){const a=A.find(id);modal({title:`Cancel ${a.id}?`,body:`<p>${esc(lookup.patient(a.patient))} · ${fmtDate(a.date)} ${esc(a.slot)}${a.pay==="Paid"?` · a refund of <b>${Portal.inr(a.paidAmount??A.fee(a))}</b> will be created`:""}.</p><div class="field"><label for="cxR">Reason</label><input id="cxR"></div>`,
    buttons:[{label:"Cancel appointment",cls:"primary",onClick:d=>{const r=A.cancel(id,{reason:d.querySelector("#cxR").value.trim(),by:"Front desk"});if(r.ok)toast(r.refund?`Cancelled · refund ${r.refund.id} created`:"Cancelled");after(r);if(!r.ok)return false;}}]});}
}
const table=crud("#list",{key:"appointments",idPrefix:"APT",noun:"appointment",title:"Appointments",readOnly:true,searchPlaceholder:"Search patient, doctor or ID",
  filters:[{k:"date",label:"Dates",options:()=>[...new Set(db.get("appointments").map(a=>a.date))].sort().map(d=>({value:d,label:fmtDate(d)+(d===T?" (today)":"")}))},{k:"status",label:"Statuses",options:["Booked","Checked In","In Consultation","Completed","Cancelled","No Show"]}],
  columns:[{k:"slot",label:"Time",fmt:(v,r)=>`<span class="mono">${esc(v)}</span><div class="muted" style="font-size:.72rem">${fmtDate(r.date)}</div>`},
    {k:"patient",label:"Patient",fmt:(v,r)=>`<b>${esc(lookup.patient(v))}</b><div class="muted mono" style="font-size:.72rem">${esc(v)} · ${esc(r.type)} · ${esc(r.source||"Front desk")}</div>`,text:r=>lookup.patient(r.patient)+" "+r.patient},
    {k:"doctor",label:"Doctor",fmt:(v,r)=>`${esc(lookup.staff(v))}<div class="muted" style="font-size:.72rem">${esc(lookup.dept(r.dept))}</div>`,text:r=>lookup.staff(r.doctor)+" "+r.id},
    {k:"token",label:"Token",fmt:v=>v?`<span class="mono">${esc(v)}</span>`:'<span class="muted">—</span>'},
    {k:"pay",label:"Payment",fmt:(v,r)=>`${pill(A.payStatus(r))}<div class="muted mono" style="font-size:.72rem">${Portal.inr(A.fee(r))}</div>`,text:r=>A.payStatus(r)},
    {k:"status",label:"Status",fmt:pill}],
  rowActions:rowButtons,
  afterRender:tb=>tb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>doAction(b.dataset.a,b.dataset.id)),
});
document.querySelector('#list [data-f="date"]').value=T;document.querySelector('#list [data-f="date"]').dispatchEvent(new Event("change"));
refreshKpis();
</script>
</body>
</html>
